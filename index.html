<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Studio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    padding: 25px 15px;
}

.container {
    max-width: 800px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    font-size: 40px;
}

header p {
    color: #94a3b8;
    margin-top: 8px;
}

.card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
}

textarea,
input,
select {
    width: 100%;
    padding: 14px;
    border: none;
    outline: none;
    border-radius: 10px;
    background: #1e293b;
    color: white;
    font-size: 16px;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-weight: bold;
}

.field {
    margin-bottom: 16px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}

.generate {
    width: 100%;
    background: #22c55e;
    color: white;
}

.generate:hover {
    background: #16a34a;
}

.clear {
    background: #475569;
    color: white;
}

.download {
    background: #3b82f6;
    color: white;
}

.copy {
    background: #8b5cf6;
    color: white;
}

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.qr-area {
    text-align: center;
    display: none;
}

.qr-area.show {
    display: block;
}

.qr-box {
    display: inline-block;
    background: white;
    padding: 18px;
    border-radius: 15px;
    margin: 15px 0;
}

#qrImage {
    display: block;
    width: 300px;
    height: 300px;
}

.status {
    color: #94a3b8;
    margin-bottom: 15px;
}

.warning {
    background: #422006;
    border: 1px solid #92400e;
    color: #fed7aa;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 18px;
    line-height: 1.5;
}

@media (max-width: 500px) {

    header h1 {
        font-size: 32px;
    }

    #qrImage {
        width: 240px;
        height: 240px;
    }

    .button-row {
        flex-direction: column;
    }

    .button-row button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>📱 QR Studio</h1>
    <p>Create QR codes from text or links</p>
</header>


<div class="card">

    <div class="warning">
        🌐 Internet is required to generate the QR code.
        Your text is sent to the QR generation service to create the image.
    </div>

    <div class="field">

        <label for="qrText">
            Text or Website
        </label>

        <textarea
            id="qrText"
            placeholder="Example: https://www.youtube.com/"
        ></textarea>

    </div>


    <div class="field">

        <label for="size">
            QR Code Size
        </label>

        <select id="size">

            <option value="200">200 × 200</option>
            <option value="300" selected>300 × 300</option>
            <option value="500">500 × 500</option>
            <option value="700">700 × 700</option>

        </select>

    </div>


    <button
        class="generate"
        onclick="generateQR()"
    >
        Generate QR Code
    </button>

</div>


<div class="card qr-area" id="qrArea">

    <h2>Your QR Code</h2>

    <p class="status" id="status">
        QR code generated successfully.
    </p>

    <div class="qr-box">

        <img
            id="qrImage"
            alt="Generated QR Code"
        >

    </div>


    <div class="button-row">

        <button
            class="download"
            onclick="downloadQR()"
        >
            📥 Download
        </button>

        <button
            class="copy"
            onclick="copyText()"
        >
            📋 Copy Text
        </button>

        <button
            class="clear"
            onclick="clearQR()"
        >
            🧹 Clear
        </button>

    </div>

</div>

</div>


<script>

let currentText = "";


/* =========================
   GENERATE QR
========================= */

function generateQR() {

    const text =
    document.getElementById("qrText")
    .value
    .trim();

    const size =
    document.getElementById("size")
    .value;


    if (text === "") {

        alert("Please enter some text or a website.");

        return;
    }


    currentText = text;


    const encodedText =
    encodeURIComponent(text);


    const qrURL =
    "https://api.qrserver.com/v1/create-qr-code/"
    + "?size=" + size + "x" + size
    + "&data=" + encodedText
    + "&format=png"
    + "&margin=10";


    const image =
    document.getElementById("qrImage");


    image.onload = function() {

        document.getElementById("status")
        .textContent =
        "QR code generated successfully.";

    };


    image.onerror = function() {

        document.getElementById("status")
        .textContent =
        "Could not generate QR code. Check your internet connection.";

    };


    image.src = qrURL;


    document
    .getElementById("qrArea")
    .classList.add("show");

}


/* =========================
   DOWNLOAD
========================= */

function downloadQR() {

    const image =
    document.getElementById("qrImage");


    if (!image.src) {

        alert("Generate a QR code first.");

        return;
    }


    const link =
    document.createElement("a");


    link.href = image.src;

    link.download = "my-qr-code.png";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}


/* =========================
   COPY TEXT
========================= */

function copyText() {

    if (currentText === "") {

        alert("Generate a QR code first.");

        return;
    }


    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
        .writeText(currentText)
        .then(function() {

            alert("Text copied!");

        })
        .catch(function() {

            alert("Could not copy the text.");

        });

    } else {

        alert("Copy is not supported by this browser.");

    }

}


/* =========================
   CLEAR
========================= */

function clearQR() {

    currentText = "";

    document.getElementById("qrText").value = "";

    document.getElementById("qrImage").src = "";

    document
    .getElementById("qrArea")
    .classList.remove("show");

}

</script>

</body>
</html>
